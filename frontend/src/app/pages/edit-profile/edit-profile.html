<div class="page-wrapper">
  <div class="mobile-container">

    <header class="header">
      <button
        class="back-btn"
        routerLink="/settings">
        ←
      </button>
      <h1>Edit Profile</h1>
    </header>

    @if (isLoading()) {
      <p class="empty-state">
        Loading profile...
      </p>

    } @else if (errorMessage()) {
      <p class="empty-state">
        {{ errorMessage() }}
      </p>
    } @else {
      <section class="form-card">
        <h3 class="section-title">
          PROFILE INFORMATION
        </h3>
        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            [ngModel]="fullName()"
            (ngModelChange)="fullName.set($event)">
        </div>
        <div class="form-group">
          <label>School</label>
          <input
            type="text"
            [ngModel]="school()"
            (ngModelChange)="school.set($event)">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            [value]="email()"
            readonly>
        </div>
        @if (errorMessage()) {
            <p class="error-message">
                {{ errorMessage() }}
            </p>
        }

        @if (successMessage()) {
            <p class="success-message">
                {{ successMessage() }}
            </p>
        }
        <button
          class="save-btn"
          [disabled]="
            isSaving()
            || !fullName().trim()
            || !school().trim()
          "
          (click)="saveProfile()">
          @if(isSaving()){
            Saving...
          } @else {
            Save Changes
          }
        </button>
      </section>
    }
  </div>
</div>
