<div class="page-wrapper">
  <div class="mobile-container">

    <header class="header">
      <button
        class="back-btn"
        routerLink="/settings">
        ←
      </button>

      <h1>Change Password</h1>
    </header>

    <section class="form-card">

      <h3 class="section-title">
        PASSWORD
      </h3>

      <!-- Current Password -->

      <div class="form-group">

        <label>Current Password</label>

        <div class="password-input">

          <input
            [type]="showCurrentPassword() ? 'text' : 'password'"
            [ngModel]="currentPassword()"
            (ngModelChange)="currentPassword.set($event)">

          <button
            type="button"
            class="toggle-password"
            (click)="showCurrentPassword.update(v => !v)">

            @if (showCurrentPassword()) {

              <!-- Eye Off -->

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C7 20 2.73 16.89 1 12c.73-2.06 2.01-3.84 3.66-5.19"></path>

                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c5 0 9.27 3.11 11 8a11.82 11.82 0 0 1-2.16 3.19"></path>

                <path d="M1 1l22 22"></path>

                <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>

              </svg>

            } @else {

              <!-- Eye -->

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3">
                </circle>

              </svg>

            }

          </button>

        </div>

      </div>

      <!-- New Password -->

      <div class="form-group">

        <label>New Password</label>

        <div class="password-input">

          <input
            [type]="showNewPassword() ? 'text' : 'password'"
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)">

          <button
            type="button"
            class="toggle-password"
            (click)="showNewPassword.update(v => !v)">

            @if (showNewPassword()) {

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C7 20 2.73 16.89 1 12c.73-2.06 2.01-3.84 3.66-5.19"></path>

                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c5 0 9.27 3.11 11 8a11.82 11.82 0 0 1-2.16 3.19"></path>

                <path d="M1 1l22 22"></path>

                <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>

              </svg>

            } @else {

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3">
                </circle>

              </svg>

            }

          </button>

        </div>

      </div>

      <!-- Confirm Password -->

      <div class="form-group">

        <label>Confirm Password</label>

        <div class="password-input">

          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)">

          <button
            type="button"
            class="toggle-password"
            (click)="showConfirmPassword.update(v => !v)">

            @if (showConfirmPassword()) {

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C7 20 2.73 16.89 1 12c.73-2.06 2.01-3.84 3.66-5.19"></path>

                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c5 0 9.27 3.11 11 8a11.82 11.82 0 0 1-2.16 3.19"></path>

                <path d="M1 1l22 22"></path>

                <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>

              </svg>

            } @else {

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">

                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3">
                </circle>

              </svg>

            }

          </button>

        </div>

      </div>

      @if (errorMessage()) {
        <p class="error-message">
          {{ errorMessage() }}
        </p>
      }

      @if (successMessage()) {
        <p class="success-message">
          {{ successMessage() }}
        </p>
      }

      <button
        class="save-btn"
        [disabled]="
          isSaving()
          || !currentPassword().trim()
          || !newPassword().trim()
          || !confirmPassword().trim()
        "
        (click)="changePassword()">

        @if (isSaving()) {
          Updating...
        } @else {
          Update Password
        }

      </button>

    </section>

  </div>
</div>
